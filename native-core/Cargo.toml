[package]
name = "digview-core"
license = "MIT"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Local indexing, discovery and safe cleanup engine for DigView"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
base64 = "0.22"
getrandom = "0.4.3"
minisign-verify = "=0.3.0"
trash = "5"
url = "2"
notify = "8.2"
pdf-extract = "=0.12.1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
quick-xml = "=0.41.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
xattr = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
tempfile = "3"
