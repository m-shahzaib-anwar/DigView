[package]
name = "digview"
version = "0.1.0"
description = "A private local file library"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "digview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "digview"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:open", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-clipboard-manager", "dep:reqwest", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [], optional = true }

[dependencies]
digview-core = { path = "../native-core" }
tauri-plugin-updater = { version = "=2.14.0", optional = true }
tauri = { version = "2.12.4", features = ["tray-icon"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.4.3"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"], optional = true }
rfd = { version = "0.17.2", optional = true }
open = { version = "5", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
